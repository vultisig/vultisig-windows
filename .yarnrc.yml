nodeLinker: node-modules

npmPreapprovedPackages:
  - '@vultisig/core-chain@6.4.1'
  - '@vultisig/core-mpc@5.2.0'
  - '@vultisig/lib-utils@0.10.7'
  - '@vultisig/mpc-types@0.4.0'
  - '@vultisig/mpc-wasm@0.1.9'
  - '@vultisig/sdk@11.1.0'

# vite-plugin-top-level-await requires rollup without declaring it; Vite 7
# brought rollup in, Vite 8 (Rolldown) does not.
packageExtensions:
  'vite-plugin-top-level-await@1.6.0':
    dependencies:
      rollup: 4.63.1

yarnPath: .yarn/releases/yarn-4.16.0.cjs
